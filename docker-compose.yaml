# Fonte unica de orquestracao do projeto: banco, API e front.
#   docker compose up --build   ->   app em http://localhost
services:
  db:
    image: postgres:17-alpine
    # Sobe junto com o Docker e se recupera de queda; so para se o usuario mandar parar.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ramajo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db@12345}
    ports:
      - "127.0.0.1:5432:5432" # so no host (DBeaver/psql); fora da LAN de proposito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready so responde OK quando o banco aceita conexao de verdade.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramajo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./system_API
    restart: unless-stopped
    depends_on:
      db:
        # Sem isto o Postgres "existe" antes de aceitar conexoes, o Flyway falha
        # no boot e a API entra em crash-loop com um erro confuso.
        condition: service_healthy
    environment:
      # Relaxed binding do Spring Boot: estas variaveis sobrepoem as chaves
      # spring.datasource.* do application.properties, sem alterar codigo.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ramajo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-db@12345}
    ports:
      - "127.0.0.1:8080:8080" # so no host: proxy do vite em `npm run dev`. O nginx do
                              # web fala com a API por http://api:8080 na rede interna,
                              # entao restringir isto nao afeta o app publicado na :80.

  # Unico servico publicado na rede local: http://<ip-do-host>
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      # So ordem de partida e o nome DNS "api"; o nginx resolve o upstream por
      # requisicao, entao um atraso no boot da API vira 502 temporario, nao crash.
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
