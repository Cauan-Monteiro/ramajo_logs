spring.application.name=system
# Flyway cria o schema; Hibernate só confere o mapeamento
spring.jpa.hibernate.ddl-auto=validate

# grava/lê timestamptz sempre em UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# migrations Flyway: aplicadas no boot da app, antes do Hibernate validar
spring.flyway.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/ramajo_db
spring.datasource.username=postgres
spring.datasource.password=db@12345

# Processo aberto automaticamente para cada carga na criação da OS.
# Semeado por V3__processo_inicial.sql.
app.processo-inicial-id=0
