spring.application.name=system
# Flyway cria o schema; Hibernate só confere o mapeamento
spring.jpa.hibernate.ddl-auto=validate

# grava/lê timestamptz sempre em UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# migrations Flyway: aplicadas no boot da app, antes do Hibernate validar
spring.flyway.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/ramajo_db
spring.datasource.username=postgres
spring.datasource.password=db@12345

# FALLBACK do processo aberto automaticamente para cada carga na criação da OS.
# A fonte da verdade é a tabela posicao_processo_inicial (V7), que dá um
# processo inicial por setor; esta propriedade só vale para uma posição que
# não tenha linha lá. É o 'Desengraxante(Inicio)' semeado por
# V3__processo_inicial.sql.
app.processo-inicial-id=0
