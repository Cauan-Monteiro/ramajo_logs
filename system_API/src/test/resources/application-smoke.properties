# Perfil do RotasSmokeTest. Banco PROPRIO: o teste semeia dados e NAO roda
# dentro de transacao (ver a classe), entao o que ele escreve fica gravado.
# Apontar para ramajo_db sujaria a base de desenvolvimento.
#
#   docker exec ramajo-db-1 psql -U postgres -c "create database ramajo_smoke"
spring.datasource.url=jdbc:postgresql://localhost:5432/ramajo_smoke
spring.datasource.username=postgres
spring.datasource.password=db@12345

# Flyway constroi o schema do zero e semeia o que as migrations semeiam
# (processo inicial, configuracao do forno).
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# O ponto do teste. Redundante com o application.properties, e de proposito:
# se alguem religar a flag em producao, este teste continua a ser o gate.
spring.jpa.open-in-view=false

app.processo-inicial-id=0
