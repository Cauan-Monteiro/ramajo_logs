server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o upstream numa variavel o nginx resolve "api"
    # a cada requisicao; com proxy_pass literal ele resolve no boot e morre se a
    # API ainda nao subiu.
    resolver 127.0.0.11 valid=10s;

    # Canal SSE de sincronizacao. Bloco proprio (match exato, que tem
    # precedencia sobre o prefixo /api/) porque o default do proxy segura a
    # resposta em buffer: com proxy_buffering on os eventos so chegariam ao
    # terminal em lotes, ou nunca.
    location = /api/estado/stream {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # keep-alive com o upstream
        proxy_buffering off;
        proxy_cache off;
        gzip off;                         # comprimir tambem bufferiza
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;            # > timeout do SseEmitter (30 min)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream http://api:8080;
        # $request_uri (e nao uma barra) preserva a query string, necessaria em
        # /api/cargas?disponiveis=true e /api/ordens?emProcesso=...
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: hoje a navegacao e por estado, mas isto evita 404 do
    # nginx no dia em que entrar um router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashes no nome do arquivo => conteudo imutavel. So o index.html nao pode
    # ser cacheado, senao o browser segura a versao velha do app.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
